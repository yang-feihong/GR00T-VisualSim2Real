callbacks:
  model_save:
    save_frequency: 200
  read_eval_locomanip:
    _target_: groot.rl.trl.callbacks.read_eval_locomanip_callback.ReadEvalLocomanipCallback
    eval_dir: ${experiment_dir}/eval
    check_interval: 1

# Environment configuration with object prediction visualization settings
env:
  config:
    # Object prediction visualization settings
    enable_obj_pred_visualization: false  # Set to false to disable visualization
    obj_pred_vis_frequency: 1           # Visualize every N training steps
    obj_pred_vis_max_envs: 20            # Maximum number of environments to visualize
    obj_pred_vis_eval_frequency: 1       # Visualize every N steps during evaluation
    show_rgb_image: False
    enforce_vis: False
    enforce_no_vis: True
    max_episode_length_s: 8  # Adjusted for grasp task which may take longer

    termination:
      terminate_after_finish_turning_for_student: True

algo:
  config:
    # Match teacher config hyperparameters
    entropy_coef: 0.01
    use_new_actor_critic: True
    num_steps_per_env: 1
    num_mini_batches: 4
    use_padding_mask: False
    ppo_shuffle_every_epoch: True
    sync_advantage_normalization: True
    actor_learning_rate: 2e-4
    critic_learning_rate: 2e-5
    homie_walk_model_path: ./models/model_walk.pt
    homie_stand_model_path: ./models/model_stand.pt
    opt_homie: False
    homie_switch_threshold: 0.5
  
    # Noise settings for distillation
    init_noise_std: 0.001
    max_noise_std: 0.001
    clamp_noise_std: True
    freeze_noise_std: True  # Keep noise frozen during distillation
    
    # PPO hyperparameters to match teacher
    gamma: 0.998  # Match teacher gamma
    lam: 0.97

    init_at_random_ep_len: True
    rollout_with_teacher_num_steps: 0
    enforce_teacher_rollout: True
    ratio_teacher_rollout: 0.5


    # Cosine learning rate scheduler configuration
    use_cosine_scheduler: false
    cosine_scheduler_warmup_steps: 500      # Warmup for 500 steps
    cosine_scheduler_final_lr: 1e-6         # Final learning rate

    network_load_dict:
      teacher_actor:
        path: ${teacher_actor_path}

    # Object prediction loss coefficient
    obj_pred_loss_coef: 0.0
    obj_pred_loss_type: "l2"

    module_dim:
      vision_feature_dim: 128

    actor:
      _target_: groot.rl.trl.modules.vision_actor_critic_modules_obj_pred.VisionActorObjPred
      running_mean_std: False
      backbone:
        vision_module:
          _target_: groot.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [vision_obs]
            output_dim: [vision_feature_dim]
            layer_config:
              type: ResNet
              resnet_type: resnet18  # Options: resnet18, resnet34, resnet50, resnet101, resnet152
              pretrained: true       # Use ImageNet pretrained weights
              trainable: true       # Set to false to freeze ResNet parameters, true to make them trainable
        mlp_module:
          _target_: groot.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [actor_obs, vision_feature_dim]
            output_dim: [-1]
            layer_config:
              type: MLP
              hidden_dims: [512, 256, 128]  # Match teacher architecture
              activation: SiLU
        obj_pred_mlp:
          _target_: groot.rl.agents.modules.modules.BaseModule
          process_output_dim: True
          module_config_dict:
            input_dim: [vision_feature_dim]
            output_dim: [3]  # 3D object position
            layer_config:
              type: MLP
              hidden_dims: [256, 128, 64]
              activation: SiLU
    teacher_actor:
      _target_: groot.rl.trl.modules.actor_critic_modules.Actor
      running_mean_std: True
      backbone:
        _target_: groot.rl.agents.modules.modules.BaseModule
        process_output_dim: True
        module_config_dict:
          input_dim: [teacher_obs]
          output_dim: [-1]
          layer_config:
            type: MLP
            hidden_dims: [512, 256, 128]  # Match teacher architecture
            activation: SiLU

