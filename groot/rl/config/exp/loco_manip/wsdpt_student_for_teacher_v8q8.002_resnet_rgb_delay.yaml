# @package _global_

defaults:
  - /algo: dagger_vision_distributed
  - /env: walk_stand_place_grasp_turn_homie
  - /simulator: isaacsim
  - /domain_rand: wsdpt_student
  - /rewards: loco_manip/reward_wsdpt_butterflyV5_teacher
  - /robot: g1/g1_43dof
  - /terrain: terrain_locomotion_plane
  - /obs: loco_manip/obs_walk_stand_place_grasp_turn_homie_distill_rgb_delay
  - /opt: wandb
  - override /trainer: trl_distill_obj_pred_homie_api

exp_base: ${hydra:runtime.choices.exp}
exp_var: test
experiment_name: walk_stand_place_grasp_turn_STUDENT_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}


simulator:
  config:
    cameras:
      enable_cameras: true
      camera_types:
        - rgb: true 
        - depth: false
      camera_resolutions: [108, 192]
    scene:
      replicate_physics: False  # Match teacher config
      env_spacing: 10.0         # Match teacher config
    sim:
      physx:
        num_position_iterations: 8  # Match teacher config
        num_velocity_iterations: 4  # Match teacher config

enable_cameras: true
headless: True

num_envs: 1024  
project_name: STUDENT_walk_stand_place_grasp_turn_homie

domain_rand:
  randomize_goal_and_obj_positions: False
  randomize_init_pos: False

  randomize_initial_dof_pos: False
  initial_dof_pos_range: [-0.05, 0.05]  
  initial_dof_pos_distribution: "uniform"
  
  randomize_initial_dof_vel: False
  initial_dof_vel_range: [-0.1, 0.1]    
  initial_dof_vel_distribution: "uniform"
  
  # DOF Position Randomization Curriculum
  dof_pos_randomization_curriculum: False
  dof_pos_randomization_initial_range: [-0.05, 0.05]
  dof_pos_randomization_max_range: [-0.1, 0.1]
  dof_pos_randomization_min_range: [-0.005, 0.005]
  
  # DOF Velocity Randomization Curriculum  
  dof_vel_randomization_curriculum: False
  dof_vel_randomization_initial_range: [-0.05, 0.05]
  dof_vel_randomization_max_range: [-0.1, 0.1]
  dof_vel_randomization_min_range: [-0.02, 0.02]

  dof_pos_vel_randomization_level_down_threshold: 75
  dof_pos_vel_randomization_level_up_threshold: 175
  dof_pos_vel_randomization_curriculum_degree: 0.00001
  
  extrinsics_randomization:
    enabled: True
    position_noise_range: # unit: meter, will be converted to [-value, value]
      x: 0.01  # [-0.02, 0.02]
      y: 0.05  # [-0.02, 0.02]
      z: 0.01  # [-0.02, 0.02]
    rotation_noise_range: # unit: radians, will be converted to [-value, value]
      roll: 0.05   # ±0.05 radians (~2.9 degrees) for roll (X-axis), will be [-0.05, 0.05]
      pitch: 0.1   # ±0.1 radians (~5.7 degrees) for pitch (Y-axis), will be [-0.1, 0.1]
      yaw: 0.05    # ±0.05 radians (~2.9 degrees) for yaw (Z-axis), will be [-0.05, 0.05] 

    curriculum:
      enabled: False
      position_noise_init_range: [-0.005, 0.005]
      position_noise_max_range: [-0.02, 0.02]
      position_noise_min_range: [-0.002, 0.002]

      # Rotation curriculum can use either:
      # 1. Legacy single range format (applied to pitch only):
      #    rotation_noise_init_range: [-0.05, 0.05]
      # 2. New per-axis format (roll, pitch, yaw):
      rotation_noise_init_range:
        roll: 0.025
        pitch: 0.05
        yaw: 0.025
      rotation_noise_max_range:
        roll: 0.05
        pitch: 0.1
        yaw: 0.05
      rotation_noise_min_range:
        roll: 0.01
        pitch: 0.02
        yaw: 0.01

      extrinsics_noise_level_down_threshold: 25
      extrinsics_noise_level_up_threshold: 70
      extrinsics_noise_curriculum_degree: 0.001


