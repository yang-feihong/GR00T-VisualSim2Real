# @package _global_

obs:
  obs_dict:
    actor_obs: [
      dof_pos,
      dof_vel,
      actions,
      projected_gravity,
      base_lin_vel,
      base_ang_vel,
      b2z1_commands,
    ]

    critic_obs: [
      dof_pos,
      dof_vel,
      actions,
      projected_gravity,
      base_lin_vel,
      base_ang_vel,
      b2z1_commands,
    ]

  obs_auxiliary:
    history_long: {
      dof_pos: 1,
      dof_vel: 1,
      actions: 1,
      projected_gravity: 1,
      base_lin_vel: 1,
      base_ang_vel: 1,
      b2z1_commands: 1,
    }
    history_short: {
      dof_pos: 1,
      dof_vel: 1,
      actions: 1,
      projected_gravity: 1,
      base_lin_vel: 1,
      base_ang_vel: 1,
      b2z1_commands: 1,
    }

  obs_scales: {
    dof_pos: 1.0,
    dof_vel: 0.05,
    history: 1.0,
    actions: 1.0,
    projected_gravity: 1.0,
    base_lin_vel: 1.0,
    base_ang_vel: 0.5,
    b2z1_commands: 1.0,
  }

  noise_scales: {
    dof_pos: 0.0,
    dof_vel: 0.0,
    history: 0.0,
    actions: 0.0,
    projected_gravity: 0.0,
    base_lin_vel: 0.0,
    base_ang_vel: 0.0,
    b2z1_commands: 0.0,
  }

  add_noise_currculum: False
  noise_initial_value: 0.0
  noise_value_max: 0.0
  noise_value_min: 0.0
  soft_dof_pos_curriculum_degree: 0.0
  soft_dof_pos_curriculum_level_down_threshold: 100
  soft_dof_pos_curriculum_level_up_threshold: 900

  obs_dims:
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.actions_dim}
    - projected_gravity: 3
    - base_lin_vel: 3
    - base_ang_vel: 3
    - b2z1_commands: 10
