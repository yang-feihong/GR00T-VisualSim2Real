# @package _global_

defaults:
  - legged_base

env:
  _target_: gr00t.rl.envs.base_task.b2z1_command_base.B2Z1CommandBase
  _recursive_: False
  config:
    max_episode_length_s: 20
    env_spacing: 5.0

    normalization:
      clip_actions: 100.0
      clip_observations: 100.0

    termination:
      terminate_when_close_to_dof_pos_limit: False
      terminate_when_close_to_dof_vel_limit: False
      terminate_when_close_to_torque_limit: False
      terminate_by_contact: False
      terminate_by_gravity: False
      terminate_by_low_height: True
    termination_scales:
      termination_close_to_dof_pos_limit: 0.98
      termination_close_to_dof_vel_limit: 0.98
      termination_close_to_torque_limit: 0.98
      termination_gravity_x: 0.7
      termination_gravity_y: 0.7
      termination_min_base_height: 0.25
      termination_contact_force: 10.0
    termination_probality:
      terminate_when_close_to_dof_pos_limit: 0.0
      terminate_when_close_to_dof_vel_limit: 0.0
      terminate_when_close_to_torque_limit: 0.0

log_task_name: b2z1_flat_lowlevel
