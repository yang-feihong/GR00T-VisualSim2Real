  # Coefficients for reward functions
  robot_distance_to_box_exp_coeff: -4.0
  holding_object_distance_exp_coeff: -4.0
  bottle_preplace_distance_exp_coeff: -4.0
  standing_still_exp_coeff: -4.0
  hand_distance_to_object_exp_coeff: -10.0
  lift_distance_to_goal_exp_coeff: -10.0
  positive_hand_closed_exp_coeff: -4.0
  finger_primitive_value: 0.5
  hand_predrop_pos_distance_exp_coeff: -4.0
  penalty_keep_hand_closed_exp_coeff: -4.0

  standing_still_reward_std: 0.15
  walk_to_table_reward_std: 0.25
  finger_dof_pos_l1_std: 0.3
  tracking_grasp_target_std: 0.3
  tracking_lift_target_dist_std: 0.2
  lift_z_threshold: 0.1


  homie_linvel_x_threshold: 0.4
  homie_linvel_y_threshold: 0.4
  homie_angvel_threshold: 0.8
  homie_lower_height_threshold: 0.2
  homie_upper_height_threshold: 0.8
  homie_lower_roll_threshold: -0.5
  homie_upper_roll_threshold: 0.5
  homie_lower_pitch_threshold: -0.5
  homie_upper_pitch_threshold: 0.5
  homie_lower_yaw_threshold: -0.5
  homie_upper_yaw_threshold: 0.5

  homie_upper_body_actions_threshold: 6.28 # 2*pi * 0.25 is effective range for upper body qpos targets

  right_arm_qpos_idx: [22, 23, 24, 25, 26, 27, 28]
  right_arm_qpos_target_hold_object: [-1.0, -0.25, 0.0, 0.75, 0.0, 0.0, 0.0]
  right_arm_qpos_target_front_object: [-0.4, -0.4, 0.0, -0.6, 0.0, 0.0, 0.0]
  right_arm_qpos_tracking_hold_object_exp_coeff: -4.0
  right_arm_qpos_tracking_front_object_exp_coeff: -4.0

  zero_XY_Ang_velocity_command_during_drop_and_pick_exp_coeff: -5.0
  zero_XY_velocity_command_during_tuning_exp_coeff: -5.0
  zero_Ang_velocity_command_during_tuning_exp_coeff: -5.0

  finger_qvel_during_right_arm_qvel_exp_coeff: -6.0
  finger_qvel_during_base_vel_exp_coeff: -6.0
  arm_qvel_during_base_vel_exp_coeff: -6.0

  track_xy_after_turning_exp_coeff: -1.0


  reward_penalty_reward_names : [
